<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="14 19 239 239" fill="none">
  <title>ES DESK — Поддержка</title>
  <desc>Специалист поддержки в золотой угловатой короне, в очках и с указкой. Фон прозрачный.</desc>
  <defs>
