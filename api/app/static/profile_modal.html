<dialog id="profileModal" aria-labelledby="profileModalTitle">
  <div class="profile-window content">
    <header class="modal-head profile-window-head">
      <h1 id="profileModalTitle">Личные данные</h1>
      <button id="closeProfileBtn" class="action" type="button" autofocus>Закрыть</button>
    </header>
      <section class="modal-body profile-window-body">
        <div class="panel profile-panel">
          <div id="profileLoading" class="profile-state">Загрузка данных...</div>
          <div id="profileError" class="profile-state profile-error hidden" role="alert"></div>
          <div id="profileSuccessMessage" class="profile-success-message hidden" role="status" aria-live="polite"></div>
          <div id="profileRoot" class="profile-root hidden">
            <section class="profile-hero">
              <div class="profile-avatar-block">
                <div id="profileAvatar" class="profile-avatar" aria-hidden="true">
                  <img id="profileAvatarImage" class="profile-avatar-image hidden" alt="" />
                  <span id="profileAvatarInitials">A</span>
                </div>
                <div class="profile-avatar-actions">
                  <input id="avatarFileInput" class="profile-avatar-file-input" type="file" accept="image/jpeg,image/png,image/webp" />
                  <button id="changeAvatarBtn" class="action profile-avatar-action" type="button">Изменить аватар</button>
                  <button id="deleteAvatarBtn" class="action danger profile-avatar-action hidden" type="button">Удалить аватар</button>
                </div>
                <div id="avatarActionMessage" class="profile-avatar-message hidden" role="status" aria-live="polite"></div>
              </div>
              <div class="profile-hero-text">
                <h1 id="profileFullNameHero">—</h1>
                <div id="profileLoginHero" class="profile-login-hero">—</div>
              </div>
            </section>

            <section class="profile-details" aria-label="Основные данные">
              <div class="profile-row">
                <div class="profile-label">ФИО</div>
                <div class="profile-value-wrap">
                  <div id="profileFullName" class="profile-value">—</div>
                </div>
              </div>
              <div class="profile-editable-row">
                <div class="profile-row profile-row-editable">
                  <div class="profile-label">Login</div>
                  <div class="profile-value-wrap">
                    <div id="profileLogin" class="profile-value">—</div>
                  </div>
                </div>
                <button id="editLoginBtn" class="profile-edit-btn" type="button" aria-label="Изменить login" title="Изменить login">✎</button>
              </div>
              <div class="profile-editable-row">
                <div class="profile-row profile-row-editable">
                  <div class="profile-label">Password</div>
                  <div class="profile-value-wrap">
                    <div id="profilePasswordMask" class="profile-value">••••••••</div>
                  </div>
                </div>
                <button id="editPasswordBtn" class="profile-edit-btn" type="button" aria-label="Изменить пароль" title="Изменить пароль">✎</button>
              </div>
              <div class="profile-row">
                <div class="profile-label">Роль</div>
                <div class="profile-value-wrap">
                  <div id="profileRole" class="profile-value">—</div>
                </div>
              </div>
              <div class="profile-row">
                <div class="profile-label">Количество заявок из старого Helpdesk</div>
                <div class="profile-value-wrap">
                  <div id="profileLegacyCount" class="profile-value">0</div>
                </div>
              </div>
              <div class="profile-row">
                <div class="profile-label">Бот уведомлений</div>
                <div class="profile-value-wrap">
                  <div id="profileTelegram" class="profile-value">—</div>
                </div>
              </div>
            </section>
          </div>
        </div>
      </section>

  </div>

      <dialog id="loginModal" class="modal" aria-label="Введите новый логин">
        <div class="modal-dialog profile-modal-dialog">
          <div class="modal-head">
            <div class="profile-modal-title">Введите новый логин</div>
            <button id="closeLoginModalBtn" type="button" class="action">Закрыть</button>
          </div>
          <div class="modal-body">
            <label>Новый login
              <input id="loginInput" type="text" autocomplete="username" />
            </label>
            <div id="loginModalError" class="profile-modal-error hidden"></div>
          </div>
          <div class="modal-foot">
            <button id="cancelLoginBtn" type="button" class="action">Отмена</button>
            <button id="saveLoginBtn" type="button" class="action primary">Сохранить</button>
          </div>
        </div>
      </dialog>

      <dialog id="passwordModal" class="modal" aria-label="Изменение пароля">
        <div class="modal-dialog profile-modal-dialog">
          <div class="modal-head">
            <div class="profile-modal-title">Изменение пароля</div>
            <button id="closePasswordModalBtn" type="button" class="action">Закрыть</button>
          </div>
          <div class="modal-body">
            <label>Введите старый пароль
              <input id="currentPasswordInput" type="password" autocomplete="current-password" />
            </label>
            <label>Введите новый пароль
              <input id="newPasswordInput" type="password" autocomplete="new-password" />
            </label>
            <label>Повторите новый пароль
              <input id="newPasswordConfirmationInput" type="password" autocomplete="new-password" />
            </label>
            <div id="passwordModalError" class="profile-modal-error hidden"></div>
          </div>
          <div class="modal-foot">
            <button id="cancelPasswordBtn" type="button" class="action">Отмена</button>
            <button id="savePasswordBtn" type="button" class="action primary">Сохранить</button>
          </div>
        </div>
      </dialog>

      <dialog id="avatarCropModal" class="modal" aria-label="Настройте аватар">
        <div class="modal-dialog profile-modal-dialog profile-avatar-modal-dialog">
          <div class="modal-head">
            <div class="profile-modal-title">Настройте аватар</div>
            <button id="closeAvatarCropBtn" type="button" class="action">Закрыть</button>
          </div>
          <div class="modal-body profile-avatar-crop-body">
            <div id="avatarCropFrame" class="profile-crop-frame">
              <canvas id="avatarCropCanvas" width="512" height="512"></canvas>
              <div class="profile-crop-ring" aria-hidden="true"></div>
            </div>
            <label class="profile-zoom-control">Масштаб
              <input id="avatarZoomInput" type="range" min="1" max="3" step="0.01" value="1" />
            </label>
            <div id="avatarCropError" class="profile-modal-error hidden"></div>
          </div>
          <div class="modal-foot">
            <button id="cancelAvatarCropBtn" type="button" class="action">Отмена</button>
            <button id="saveAvatarCropBtn" type="button" class="action primary">Сохранить</button>
          </div>
        </div>
      </dialog>

      <dialog id="deleteAvatarModal" class="modal" aria-label="Удалить аватар?">
        <div class="modal-dialog profile-modal-dialog">
          <div class="modal-head">
            <div class="profile-modal-title">Удалить аватар?</div>
            <button id="closeDeleteAvatarBtn" type="button" class="action">Закрыть</button>
          </div>
          <div class="modal-body">
            <p class="profile-confirm-text">Аватар будет удалён из профиля.</p>
            <div id="deleteAvatarError" class="profile-modal-error hidden"></div>
          </div>
          <div class="modal-foot">
            <button id="cancelDeleteAvatarBtn" type="button" class="action">Отмена</button>
            <button id="confirmDeleteAvatarBtn" type="button" class="action danger">Удалить</button>
          </div>
        </div>
      </dialog>
</dialog>
