<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ES Helpdesk - Отзывы</title>
  <link rel="stylesheet" href="/static/styles.css?v=20261024-client-controls-v2" />
</head>
<body data-sidebar-ready="0">
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-brand">ES DESK</div>
      <h2 class="sidebar-title">&#1047;&#1072;&#1103;&#1074;&#1082;&#1080;</h2>
      <div class="tab-list">
        <a class="tab-btn admin-only hidden" href="/tickets?tab=unassigned" data-tab="unassigned"><span class="tab-btn-label">&#1053;&#1077;&#1088;&#1072;&#1089;&#1087;&#1088;&#1077;&#1076;&#1077;&#1083;&#1105;&#1085;&#1085;&#1099;&#1077;</span><span class="tab-btn-count" data-tab-count="unassigned">0</span></a>
        <a class="tab-btn" href="/tickets?tab=active" data-tab="active"><span class="tab-btn-label">&#1040;&#1082;&#1090;&#1080;&#1074;&#1085;&#1099;&#1077;</span><span class="tab-btn-count" data-tab-count="active">0</span></a>
        <a class="tab-btn" href="/tickets?tab=frozen" data-tab="frozen"><span class="tab-btn-label">&#1047;&#1072;&#1084;&#1086;&#1088;&#1086;&#1078;&#1077;&#1085;&#1085;&#1099;&#1077;</span><span class="tab-btn-count" data-tab-count="frozen">0</span></a>
        <a class="tab-btn" href="/tickets?tab=closed" data-tab="closed"><span class="tab-btn-label">&#1047;&#1072;&#1082;&#1088;&#1099;&#1090;&#1099;&#1077;</span><span class="tab-btn-count" data-tab-count="closed">0</span></a>
        <a class="tab-btn admin-only hidden" href="/tickets?tab=special" data-tab="special"><span class="tab-btn-label">&#1054;&#1089;&#1086;&#1073;&#1099;&#1077;</span><span class="tab-btn-count" data-tab-count="special">0</span></a>
      </div>
      <div id="adminAgentFilter" class="admin-agent-filter admin-only hidden">
        <label class="status-panel-title admin-agent-header">
          <input id="adminAgentToggleAll" type="checkbox" />
          <span>&#1042;&#1089;&#1077; &#1079;&#1072;&#1103;&#1074;&#1082;&#1080;</span>
        </label>
        <div id="adminAgentList" class="admin-agent-list"></div>
      </div>
      <a class="settings-link admin-only hidden" href="/settings">
        <span>Настройки</span>
        <img src="/static/settings-gear.svg" alt="" />
      </a>
      <a class="settings-link active admin-only hidden" href="/management">
        <span>Управление</span>
      </a>
      <div class="sidebar-admin-separator admin-only hidden"></div>
      <a class="settings-link admin-only hidden" href="/statuses">
        <span>Статусы</span>
      </a>
      <a class="settings-link admin-only hidden" href="/management/tasks">
        <span>Задачи и Регулярки</span>
      </a>
      <div class="sidebar-bottom">
        <div class="status-panel hidden">
          <div class="status-panel-title">Статус</div>
          <button class="agent-status-btn status-online" data-availability-status="online">В сети</button>
          <button class="agent-status-btn status-on-ticket" data-availability-status="on_ticket">На заявке</button>
          <button class="agent-status-btn status-waiting" data-availability-status="waiting">В ожидании</button>
          <button class="agent-status-btn status-lunch" data-availability-status="lunch">Обед</button>
          <button class="agent-status-btn status-offline" data-availability-status="offline">Не в сети</button>
        </div>
        <div class="sidebar-user-actions">
          <div class="agent-avatar" title="&#1058;&#1077;&#1082;&#1091;&#1097;&#1080;&#1081; &#1087;&#1086;&#1083;&#1100;&#1079;&#1086;&#1074;&#1072;&#1090;&#1077;&#1083;&#1100;">A</div>
          <form action="/logout" method="post" data-sidebar-logout-form hidden></form>
        </div>
      </div>
    </aside>

    <main id="appContent" class="main" data-shell-page="reviews">
      <link rel="stylesheet" href="/static/reviews.css?v=20261024-reviews-v2" />
      <div class="toolbar">
        <button class="action" type="button" data-shell-back>Назад</button>
        <h1 class="settings-title">Отзывы</h1>
        <div class="display-settings">
          <button id="themeToggleBtn" class="action theme-toggle" type="button" aria-label="Оформление">Оформление</button>
        </div>
      </div>
      <section class="panel reviews-page" aria-label="Отзывы">
        <div class="integration-log-filters reviews-filters">
          <div id="reviewEmployeeField" hidden></div>
          <label>Дата от:
            <input id="reviewDateFrom" type="date" disabled />
          </label>
          <label>Дата до:
            <input id="reviewDateTo" type="date" disabled />
          </label>
        </div>
        <div id="reviewStats" class="reviews-stats" hidden>
          <span>Оценок за период: <strong id="reviewCount"></strong></span>
          <span>Средняя оценка: <strong id="reviewAverage"></strong></span>
        </div>
        <p id="reviewStatus" class="status reviews-status" role="status" aria-live="polite">Загрузка...</p>
        <div id="reviewTableWrap" class="table-scroll reviews-table-wrap" hidden>
          <table class="reviews-table">
            <thead><tr>
              <th scope="col">Дата</th>
              <th scope="col">Имя клиента</th>
              <th scope="col">Заголовок заявки</th>
              <th scope="col">Оценка</th>
              <th scope="col">Текст отзыва</th>
            </tr></thead>
            <tbody id="reviewTableBody"></tbody>
          </table>
        </div>
        <nav id="reviewPagination" class="table-pagination-footer reviews-pagination" aria-label="Страницы отзывов" hidden>
          <button id="reviewPrev" class="action table-page-btn" type="button">Назад</button>
          <span id="reviewPageSummary"></span>
          <button id="reviewNext" class="action table-page-btn" type="button">Вперёд</button>
        </nav>
      </section>
    </main>
  </div>

  <script src="/static/theme.js?v=20261024-appearance-v2"></script>
  <script src="/static/sidebar.js?v=20261012a"></script>
  <script src="/static/error_dialog.js?v=20261011a"></script>
  <script src="/static/app_shell.js?v=20261024-client-controls-v2"></script>
  <script src="/static/reviews.js?v=20260907a"></script>
</body>
</html>
