<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ES DESK - Статусы сотрудников</title>
  <link rel="icon" type="image/svg+xml" sizes="any" href="/static/chert.svg?v=20261028-favicon-v1" />
  <link rel="stylesheet" href="/static/styles.css?v=20261106-ticket-table-v2" />
</head>
<body class="statuses-page">
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-brand">ES DESK</div>
      <h2 class="sidebar-title">Заявки</h2>
      <div class="tab-list">
        <a class="tab-btn" href="/tickets?tab=unassigned"><span class="tab-btn-label">Нераспределённые</span><span class="tab-btn-count" data-tab-count="unassigned">0</span></a>
        <a class="tab-btn" href="/tickets?tab=active"><span class="tab-btn-label">Активные</span><span class="tab-btn-count" data-tab-count="active">0</span></a>
        <a class="tab-btn" href="/tickets?tab=frozen"><span class="tab-btn-label">Замороженные</span><span class="tab-btn-count" data-tab-count="frozen">0</span></a>
        <a class="tab-btn" href="/tickets?tab=closed"><span class="tab-btn-label">Закрытые</span><span class="tab-btn-count" data-tab-count="closed">0</span></a>
        <a class="tab-btn admin-only hidden" href="/tickets?tab=special"><span class="tab-btn-label">Особые</span><span class="tab-btn-count" data-tab-count="special">0</span></a>
      </div>
      <div id="adminAgentFilter" class="admin-agent-filter admin-only hidden">
        <label class="status-panel-title admin-agent-header">
          <input id="adminAgentToggleAll" type="checkbox" />
          <span>Все заявки</span>
        </label>
        <div id="adminAgentList" class="admin-agent-list"></div>
      </div>
      <a class="settings-link admin-only hidden" href="/settings">
        <span>Настройки</span>
        <img src="/static/settings-gear.svg" alt="" />
      </a>
      <a class="settings-link admin-only hidden" href="/management">
        <span>Управление</span>
      </a>
      <div class="sidebar-admin-separator admin-only hidden"></div>
      <a class="settings-link active admin-only hidden" href="/statuses">
        <span>Статусы</span>
      </a>
      <a class="settings-link admin-only hidden" href="/management/tasks">
        <span>Задачи и Регулярки</span>
      </a>
      <div class="sidebar-bottom">
        <div class="sidebar-user-actions">
          <div class="agent-avatar" title="Пользователь">A</div>
          <form action="/logout" method="post" data-sidebar-logout-form hidden></form>
        </div>
      </div>
    </aside>

    <main id="appContent" class="main" data-shell-page="statuses">
      <div class="toolbar">
        <button class="action" type="button" data-shell-back>Назад</button>
        <div class="settings-title">Статусы</div>
        <div class="display-settings">
          <button id="themeToggleBtn" class="action theme-toggle" type="button" aria-label="Оформление">Оформление</button>
        </div>
      </div>

      <section class="content" style="grid-template-columns: 1fr;">
        <div class="panel status-board">
          <div class="settings-section-tabs status-page-tabs" role="tablist" aria-label="Разделы статусов">
            <button class="action active" type="button" data-status-tab="board" role="tab" aria-selected="true" aria-controls="statusBoardPanel">Управление статусами сотрудников</button>
            <button class="action" type="button" data-status-tab="log" role="tab" aria-selected="false" aria-controls="statusLogPanel">Лог смены статусов</button>
          </div>
          <section id="statusBoardPanel" role="tabpanel">
            <div id="statusBoardGrid" class="status-board-grid"></div>
            <div id="statusBoardEmpty" class="status hidden">Активных сотрудников нет</div>
          </section>
          <section id="statusLogPanel" role="tabpanel" hidden>
            <div class="integration-log-filters status-log-filters">
              <label>Сотрудник:<select id="statusLogEmployee"><option value="">Все сотрудники</option></select></label>
              <label>Период:<select id="statusLogPeriod">
                <option value="today">Сегодня</option><option value="yesterday">Вчера</option>
                <option value="week">Неделя</option><option value="30days" selected>30 дней</option>
                <option value="month">Месяц</option><option value="year">Год</option>
                <option value="all">За всё время</option><option value="custom">Произвольный</option>
              </select></label>
              <label class="status-log-custom" hidden>с:<input id="statusLogDateFrom" type="date" /></label>
              <label class="status-log-custom" hidden>по:<input id="statusLogDateTo" type="date" /></label>
              <label>Сортировка:<select id="statusLogOrder"><option value="desc">Сначала новые</option><option value="asc">Сначала старые</option></select></label>
            </div>
            <div id="statusLogMessage" class="status" role="status"></div>
            <div class="table-scroll status-log-viewport">
              <table class="status-log-table">
                <thead><tr><th>Сотрудник</th><th>Был статус</th><th>Стал статус</th><th data-status-log-sort aria-sort="descending"><button type="button" class="status-log-sort">Дата</button></th><th data-status-log-sort aria-sort="descending"><button type="button" class="status-log-sort">Время</button></th></tr></thead>
                <tbody id="statusLogTableBody"></tbody>
              </table>
              <div id="statusLogEmpty" class="status">За выбранный период смен статусов нет</div>
            </div>
            <nav class="table-pagination-footer status-log-pagination" aria-label="Страницы лога смены статусов">
              <button id="statusLogPrev" class="action" type="button" disabled>Назад</button>
              <span id="statusLogSummary" aria-live="polite"></span>
              <button id="statusLogNext" class="action" type="button" disabled>Вперёд</button>
            </nav>
          </section>
        </div>
      </section>
  <div id="errorModal" class="modal hidden">
    <div class="modal-dialog error-dialog">
      <div class="modal-head">
        <div style="font-weight:700;">Ошибка</div>
        <button id="closeErrorModalBtn" type="button" class="action">Закрыть</button>
      </div>
      <div class="modal-body">
        <textarea id="errorText" class="error-textarea" readonly></textarea>
      </div>
      <div class="modal-foot">
        <button id="copyErrorBtn" type="button" class="action">Скопировать</button>
        <button id="okErrorBtn" type="button" class="action primary">Понятно</button>
      </div>
    </div>
  </div>

    </main>
  </div>


  <script src="/static/theme.js?v=20261029-contour-delete-only-v1"></script>
  <script src="/static/sidebar.js?v=20261106-personal-stats-v2"></script>
  <script src="/static/error_dialog.js?v=20261011a"></script>
  <script src="/static/app_shell.js?v=20261106-table-shell-v1"></script>
  <script src="/static/management_statistics.js?v=20261025-stats-final-v2"></script>
  <script src="/static/status_transitions.js?v=20261025-stats-final-v2"></script>
  <script src="/static/statuses.js?v=20261025-status-log-v2"></script>
</body>
</html>
