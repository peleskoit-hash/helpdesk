<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ES Helpdesk - Сохранённые файлы</title>
  <link rel="stylesheet" href="/static/styles.css?v=20261021-task-panel-refresh" />
</head>
<body data-sidebar-ready="0">
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-brand">ES DESK</div>
      <h2 class="sidebar-title">&#1047;&#1072;&#1103;&#1074;&#1082;&#1080;</h2>
      <div class="tab-list">
        <a class="tab-btn admin-only hidden" href="/tickets?tab=unassigned" data-tab="unassigned"><span class="tab-btn-label">&#1053;&#1077;&#1088;&#1072;&#1089;&#1087;&#1088;&#1077;&#1076;&#1077;&#1083;&#1105;&#1085;&#1085;&#1099;&#1077;</span><span class="tab-btn-count" data-tab-count="unassigned">0</span></a>
        <a class="tab-btn" href="/tickets?tab=active" data-tab="active"><span class="tab-btn-label">&#1040;&#1082;&#1090;&#1080;&#1074;&#1085;&#1099;&#1077;</span><span class="tab-btn-count" data-tab-count="active">0</span></a>
        <a class="tab-btn" href="/tickets?tab=frozen" data-tab="frozen"><span class="tab-btn-label">&#1047;&#1072;&#1084;&#1086;&#1088;&#1086;&#1078;&#1077;&#1085;&#1085;&#1099;&#1077;</span><span class="tab-btn-count" data-tab-count="frozen">0</span></a>
        <a class="tab-btn" href="/tickets?tab=closed" data-tab="closed"><span class="tab-btn-label">&#1047;&#1072;&#1082;&#1088;&#1099;&#1090;&#1099;&#1077;</span><span class="tab-btn-count" data-tab-count="closed">0</span></a>
        <a class="tab-btn admin-only hidden" href="/tickets?tab=special" data-tab="special"><span class="tab-btn-label">&#1054;&#1089;&#1086;&#1073;&#1099;&#1077;</span><span class="tab-btn-count" data-tab-count="special">0</span></a>
      </div>
      <div id="adminAgentFilter" class="admin-agent-filter admin-only hidden">
        <label class="status-panel-title admin-agent-header">
          <input id="adminAgentToggleAll" type="checkbox" />
          <span>&#1042;&#1089;&#1077; &#1079;&#1072;&#1103;&#1074;&#1082;&#1080;</span>
        </label>
        <div id="adminAgentList" class="admin-agent-list"></div>
      </div>
      <a class="settings-link admin-only hidden" href="/settings">
        <span>Настройки</span>
        <img src="/static/settings-gear.svg" alt="" />
      </a>
      <a class="settings-link active admin-only hidden" href="/management">
        <span>Управление</span>
      </a>
      <div class="sidebar-admin-separator admin-only hidden"></div>
      <a class="settings-link admin-only hidden" href="/statuses">
        <span>Статусы</span>
      </a>
      <a class="settings-link admin-only hidden" href="/management/tasks">
        <span>Задачи и Регулярки</span>
      </a>
      <div class="sidebar-bottom">
        <div class="sidebar-user-actions">
          <div class="agent-avatar" title="Текущий пользователь">A</div>
          <form action="/logout" method="post" data-sidebar-logout-form hidden></form>
        </div>
      </div>
    </aside>

    <main id="appContent" class="main" data-shell-page="management-saved-files">
      <div class="toolbar">
        <button class="action" type="button" data-shell-back>Назад</button>
        <div class="settings-title">Сохранённые файлы</div>
        <div class="display-settings">
          <button id="themeToggleBtn" class="action theme-toggle" type="button" aria-label="Переключить тему">Тёмная тема</button>
        </div>
      </div>
      <div class="management-saved-files-page">
        <div class="panel table-wrap management-saved-files-panel">
          <div class="management-saved-files-toolbar">
            <button id="managementSavedFilesUploadBtn" class="action primary" type="button">Добавить файл</button>
            <button id="managementSavedFilesDownloadBtn" class="action" type="button" disabled>Скачать</button>
            <button id="managementSavedFilesRenameBtn" class="action" type="button" disabled>Переименовать</button>
            <button id="managementSavedFilesReplaceBtn" class="action" type="button" disabled>Заменить файл</button>
            <button id="managementSavedFilesDeleteBtn" class="action danger" type="button" disabled>Удалить</button>
            <span id="managementSavedFilesActionNote" class="status management-saved-files-note"></span>
            <span id="managementSavedFilesStatus" class="status management-saved-files-status" role="status" aria-live="polite">Загрузка...</span>
            <input id="managementSavedFilesUploadInput" type="file" hidden />
            <input id="managementSavedFilesReplaceInput" type="file" hidden />
          </div>

          <div class="table-scroll management-saved-files-table-wrap">
            <table class="management-saved-files-table">
              <thead>
                <tr>
                  <th scope="col">Имя файла</th>
                  <th scope="col">Размер</th>
                  <th scope="col">Используется</th>
                  <th scope="col">Где используется</th>
                </tr>
              </thead>
              <tbody id="managementSavedFilesTableBody"></tbody>
            </table>
            <div id="managementSavedFilesEmpty" class="status management-saved-files-empty">Загрузка...</div>
          </div>
        </div>
      </div>

      <div id="managementSavedFilesRenameModal" class="modal hidden">
        <div class="modal-dialog management-saved-files-dialog" role="dialog" aria-modal="true" aria-labelledby="managementSavedFilesRenameTitle">
          <div class="modal-head">
            <div id="managementSavedFilesRenameTitle" style="font-weight:700;">Переименовать файл</div>
            <button id="managementSavedFilesRenameCloseBtn" type="button" class="action">Закрыть</button>
          </div>
          <form id="managementSavedFilesRenameForm" class="modal-body management-saved-files-rename-form">
            <label>Имя файла
              <input id="managementSavedFilesRenameInput" class="input" name="display_filename" autocomplete="off" />
            </label>
            <div id="managementSavedFilesRenameError" class="field-error" hidden></div>
            <div class="modal-foot">
              <button id="managementSavedFilesRenameSaveBtn" class="action primary" type="submit">Сохранить</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="/static/theme.js?v=20261012a"></script>
  <script src="/static/sidebar.js?v=20261012a"></script>
  <script src="/static/error_dialog.js?v=20261011a"></script>
  <script src="/static/app_shell.js?v=20261021-client-origin-input"></script>
  <script src="/static/management_saved_files.js?v=20261021-all-save-feedback"></script>
</body>
</html>
