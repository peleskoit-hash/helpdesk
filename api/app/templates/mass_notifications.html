<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ES DESK - Массовые оповещения</title>
  <link rel="icon" type="image/svg+xml" sizes="any" href="/static/chert.svg?v=20261028-favicon-v1" />
  <link rel="stylesheet" href="/static/styles.css?v=20261027-active-status-v1" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-brand">ES DESK</div>
      <h2 class="sidebar-title">Заявки</h2>
      <div class="tab-list">
        <a class="tab-btn" href="/tickets?tab=unassigned"><span class="tab-btn-label">Нераспределённые</span><span class="tab-btn-count" data-tab-count="unassigned">0</span></a>
        <a class="tab-btn" href="/tickets?tab=active"><span class="tab-btn-label">Активные</span><span class="tab-btn-count" data-tab-count="active">0</span></a>
        <a class="tab-btn" href="/tickets?tab=frozen"><span class="tab-btn-label">Замороженные</span><span class="tab-btn-count" data-tab-count="frozen">0</span></a>
        <a class="tab-btn" href="/tickets?tab=closed"><span class="tab-btn-label">Закрытые</span><span class="tab-btn-count" data-tab-count="closed">0</span></a>
        <a class="tab-btn admin-only hidden" href="/tickets?tab=special"><span class="tab-btn-label">Особые</span><span class="tab-btn-count" data-tab-count="special">0</span></a>
      </div>
      <div id="adminAgentFilter" class="admin-agent-filter admin-only hidden">
        <label class="status-panel-title admin-agent-header">
          <input id="adminAgentToggleAll" type="checkbox" />
          <span>Все заявки</span>
        </label>
        <div id="adminAgentList" class="admin-agent-list"></div>
      </div>
      <a class="settings-link admin-only hidden" href="/settings">
        <span>Настройки</span>
        <img src="/static/settings-gear.svg" alt="" />
      </a>
      <a class="settings-link admin-only hidden" href="/management">
        <span>Управление</span>
      </a>
      <div class="sidebar-admin-separator admin-only hidden"></div>
      <a class="settings-link admin-only hidden" href="/statuses">
        <span>Статусы</span>
      </a>
      <a class="settings-link admin-only hidden" href="/management/tasks">
        <span>Задачи и Регулярки</span>
      </a>
      <div class="sidebar-bottom">
        <div class="sidebar-user-actions">
          <div class="agent-avatar" title="Пользователь">A</div>
          <form action="/logout" method="post" data-sidebar-logout-form hidden></form>
        </div>
      </div>
    </aside>

    <main id="appContent" class="main" data-shell-page="mass-notifications">
      <div class="toolbar">
        <button id="backToManagementBtn" class="action" type="button">Назад</button>
        <div class="settings-title">Массовые оповещения</div>
        <div class="display-settings">
          <button id="themeToggleBtn" class="action theme-toggle" type="button" aria-label="Оформление">Оформление</button>
        </div>
      </div>

      <section class="content" style="grid-template-columns: 1fr;">
        <div class="panel settings-panel">
          <div class="card-head">
            <div style="font-weight:700;">Массовые оповещения в Telegram</div>
          </div>
          <div class="modal-body" style="padding: 12px;">
            <label>Тип сотрудника
              <select id="filterFieldSelect">
                <option value="" selected>Не выбрано</option>
                <option value="__all__">Все</option>
                <option value="Песок">Песок</option>
                <option value="Отдел Продаж">Отдел Продаж</option>
                <option value="Колл Центр">Колл Центр</option>
                <option value="HR">HR</option>
                <option value="Руководство">Руководство</option>
                <option value="Отдел Коучей">Отдел Коучей</option>
                <option value="Контроль Качества">Контроль Качества</option>
              </select>
            </label>
            <label>Ветвление
              <select id="filterValueSelect" disabled>
                <option value="" selected>Не выбрано</option>
              </select>
            </label>
            <label>Расположение
              <select id="locationTypeSelect">
                <option value="" selected>Не выбрано</option>
              </select>
            </label>
            <div class="status">Получатели: <span id="recipientCount">0</span></div>
            <label>Текст оповещения
              <textarea id="broadcastText" rows="8" placeholder="Введите текст сообщения для рассылки"></textarea>
            </label>
            <input id="broadcastFilesInput" type="file" multiple hidden />
            <div id="broadcastFilesList" class="selected-files hidden"></div>
            <div class="modal-foot" style="padding: 0; border-top: 0; justify-content: flex-start; gap: 8px;">
              <button id="addBroadcastFilesBtn" type="button" class="action">Добавить файлы</button>
              <button id="sendBroadcastBtn" type="button" class="action primary">Отправить оповещение</button>
            </div>
            <div id="resultBox" class="status"></div>
          </div>
        </div>
      </section>
  <div id="errorModal" class="modal hidden">
    <div class="modal-dialog error-dialog">
      <div class="modal-head">
        <div style="font-weight:700;">Ошибка</div>
        <button id="closeErrorModalBtn" type="button" class="action">Закрыть</button>
      </div>
      <div class="modal-body">
        <textarea id="errorText" class="error-textarea" readonly></textarea>
      </div>
      <div class="modal-foot">
        <button id="copyErrorBtn" type="button" class="action">Скопировать</button>
        <button id="okErrorBtn" type="button" class="action primary">Понятно</button>
      </div>
    </div>
  </div>

    </main>
  </div>


  <script src="/static/theme.js?v=20261028-pattern-api-v1"></script>
  <script src="/static/sidebar.js?v=20261027-themed-dialogs-v1"></script>
  <script src="/static/error_dialog.js?v=20261011a"></script>
  <script src="/static/app_shell.js?v=20261027-type-palette-dialogs-v1"></script>
  <script src="/static/mass_notifications.js?v=20261013b"></script>
</body>
</html>
