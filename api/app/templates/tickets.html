<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Helpdesk MVP - Список заявок</title>
  <link rel="stylesheet" href="/static/styles.css?v=20260821b" />
</head>
<body data-sidebar-ready="0">
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-brand">ES DESK</div>
      <h2 class="sidebar-title">Заявки</h2>
      <div class="tab-list">
        <a class="tab-btn admin-only hidden" href="/tickets?tab=unassigned" data-tab="unassigned"><span class="tab-btn-label">Нераспределённые</span><span class="tab-btn-count" data-tab-count="unassigned">0</span></a>
        <a class="tab-btn active" href="/tickets?tab=active" data-tab="active"><span class="tab-btn-label">Активные</span><span class="tab-btn-count" data-tab-count="active">0</span></a>
        <a class="tab-btn" href="/tickets?tab=frozen" data-tab="frozen"><span class="tab-btn-label">Замороженные</span><span class="tab-btn-count" data-tab-count="frozen">0</span></a>
        <a class="tab-btn" href="/tickets?tab=closed" data-tab="closed"><span class="tab-btn-label">Закрытые</span><span class="tab-btn-count" data-tab-count="closed">0</span></a>
        <a class="tab-btn admin-only hidden" href="/tickets?tab=special" data-tab="special"><span class="tab-btn-label">Особые</span><span class="tab-btn-count" data-tab-count="special">0</span></a>
      </div>
      <div id="adminAgentFilter" class="admin-agent-filter admin-only hidden">
        <label class="status-panel-title admin-agent-header">
          <input id="adminAgentToggleAll" type="checkbox" />
          <span>Все заявки</span>
        </label>
        <div id="adminAgentList" class="admin-agent-list"></div>
      </div>
      <a class="settings-link admin-only hidden" href="/settings">
        <span>Настройки</span>
        <img src="/static/settings-gear.svg" alt="" />
      </a>
      <a class="settings-link admin-only hidden" href="/statuses">
        <span>Статусы</span>
      </a>
      <a class="settings-link admin-only hidden" href="/mass-notifications">
        <span>Массовые оповещения</span>
      </a>
      <div id="sidebarUserStats" class="sidebar-user-stats">
        <div class="sidebar-user-name-row">
          <div id="sidebarUserDisplayName" class="sidebar-user-name">—</div>
          <button id="completionToggleBtn" type="button" class="completion-toggle-icon hidden" aria-label="Показать статистику">
            <span id="completionSummaryArrow" class="completion-arrow">▼</span>
          </button>
        </div>
        <div id="completionDetails" class="completion-details hidden">
          <div class="completion-heading">
            <span class="completion-title-text">Выполнено:</span>
          </div>
          <table class="completion-table">
            <thead>
              <tr>
                <th>Текущий:</th>
                <th class="tickets">Заявки</th>
                <th class="tasks">Задачи</th>
                <th class="total">Итого</th>
              </tr>
            </thead>
            <tbody>
              <tr><td>Год</td><td class="tickets" id="completionYearTickets">0</td><td class="tasks" id="completionYearTasks">0</td><td class="total" id="completionYearTotal">0</td></tr>
              <tr><td>Месяц</td><td class="tickets" id="completionMonthTickets">0</td><td class="tasks" id="completionMonthTasks">0</td><td class="total" id="completionMonthTotal">0</td></tr>
              <tr><td>Неделя</td><td class="tickets" id="completionWeekTickets">0</td><td class="tasks" id="completionWeekTasks">0</td><td class="total" id="completionWeekTotal">0</td></tr>
              <tr><td>День</td><td class="tickets" id="completionDayTickets">0</td><td class="tasks" id="completionDayTasks">0</td><td class="total" id="completionDayTotal">0</td></tr>
              <tr><td>Всё время</td><td class="tickets" id="completionAllTimeTickets">0</td><td class="tasks" id="completionAllTimeTasks">0</td><td class="total" id="completionAllTimeTotalRow">0</td></tr>
            </tbody>
          </table>
          <div class="completion-footer">
            <span class="completion-chip legacy">Legacy:&nbsp;&nbsp;<b id="completionLegacy">0</b></span>
          </div>
        </div>
      </div>
      <div class="sidebar-bottom">
        <div class="status-panel hidden">
          <div class="status-panel-title">Статус</div>
          <button class="agent-status-btn status-offline" data-availability-status="offline">Не в сети</button>
          <button class="agent-status-btn status-online" data-availability-status="online">В сети</button>
          <button class="agent-status-btn status-on-ticket" data-availability-status="on_ticket">На заявке</button>
          <button class="agent-status-btn status-waiting" data-availability-status="waiting">В ожидании</button>
          <button class="agent-status-btn status-lunch" data-availability-status="lunch">Обед</button>
        </div>
        <div class="sidebar-user-actions">
          <div class="agent-avatar" title="Текущий пользователь">A</div>
          <form action="/logout" method="post" data-sidebar-logout-form hidden></form>
        </div>
      </div>
    </aside>

    <main id="appContent" class="main" data-shell-page="tickets-list">
      <div class="toolbar">
        <label id="roleControl" class="hidden">Роль
          <select id="roleSelect">
            <option value="agent" selected>Сотрудник</option>
            <option value="admin">Администратор</option>
            <option value="trainee">Стажёр</option>
            <option value="chiki_piki">Чики-пики</option>
          </select>
        </label>

        <label id="agentSelectWrap" class="hidden">Пользователь
          <select id="agentSelect"></select>
        </label>

        <div class="search-input-wrap">
          <input id="searchInput" placeholder="Поиск по теме/клиенту/сообщениям" />
          <button id="searchClearBtn" class="search-clear-btn hidden" type="button" aria-label="Очистить поиск">&times;</button>
        </div>
        <button id="bulkAssignBtn" class="action bulk-assign-btn admin-only hidden" type="button">Назначить ответственно</button>
        <button id="bulkCloseBtn" class="action admin-only hidden" type="button" disabled>Завершить</button>
        <button id="bulkDeleteBtn" class="action admin-only hidden danger" type="button" disabled>Удалить</button>
        <button id="themeToggleBtn" class="action theme-toggle" type="button" aria-label="Переключить тему">Тёмная тема</button>
        <span class="status" id="statusText">Готово</span>
      </div>

      <section class="content" style="grid-template-columns: 1fr;">
        <div class="panel table-wrap">
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th class="admin-select-col hidden"><button id="selectAllTicketsBtn" class="mini-check-btn" type="button">✓</button></th>
                  <th class="ticket-subject-col"><button type="button" class="table-sort-btn" data-sort-key="subject">Тема</button></th>
                  <th class="ticket-client-col"><button type="button" class="table-sort-btn" data-sort-key="requester_display_name">Заявка от</button></th>
                  <th class="admin-assignee-col ticket-assignee-col hidden"><button type="button" class="table-sort-btn" data-sort-key="assignee_name">Исполнитель</button></th>
                  <th class="ticket-age-col"><button type="button" class="table-sort-btn" data-sort-key="age_created">С создания</button></th>
                  <th class="ticket-created-col"><button type="button" class="table-sort-btn" data-sort-key="created_at">Дата создания</button></th>
                  <th class="ticket-last-reply-col"><button type="button" class="table-sort-btn" data-sort-key="last_reply_at">Последний ответ</button></th>
                </tr>
              </thead>
              <tbody id="ticketsTableBody"></tbody>
            </table>
            <div id="emptyText" class="status" style="padding:12px;">Список пуст</div>
          </div>
          <div class="table-pagination-footer">
            <div class="table-pagination-total">Всего: <span id="ticketCount">0</span></div>
            <div class="table-pagination-nav">
              <button id="prevPageBtn" class="action table-page-btn" type="button" aria-label="Предыдущая страница">&lt;</button>
              <div id="paginationPages" class="table-pagination-pages"></div>
              <button id="nextPageBtn" class="action table-page-btn" type="button" aria-label="Следующая страница">&gt;</button>
            </div>
          </div>
        </div>
      </section>
  <div id="assignModal" class="modal hidden">
    <div class="modal-dialog assign-dialog">
      <div class="modal-head">
        <div style="font-weight:700;">Назначить ответственного</div>
        <button id="closeAssignModalBtn" type="button" class="action">Закрыть</button>
      </div>
      <div class="modal-body">
        <label>Исполнитель
          <select id="bulkAssigneeSelect"></select>
        </label>
      </div>
      <div class="modal-foot">
        <button id="confirmBulkAssignBtn" type="button" class="action primary">Назначить</button>
      </div>
    </div>
  </div>

  <div id="bulkActionModal" class="modal hidden">
    <div class="modal-dialog assign-dialog">
      <div class="modal-head">
        <div id="bulkActionModalTitle" style="font-weight:700;">Подтверждение</div>
        <button id="closeBulkActionModalBtn" type="button" class="action">Закрыть</button>
      </div>
      <div id="bulkActionModalText" class="modal-body"></div>
      <div class="modal-foot">
        <button id="cancelBulkActionBtn" type="button" class="action">Отмена</button>
        <button id="confirmBulkActionBtn" type="button" class="action primary">Подтвердить</button>
      </div>
    </div>
  </div>

  <div id="errorModal" class="modal hidden">
    <div class="modal-dialog error-dialog">
      <div class="modal-head">
        <div style="font-weight:700;">Ошибка</div>
        <button id="closeErrorModalBtn" type="button" class="action">Закрыть</button>
      </div>
      <div class="modal-body">
        <textarea id="errorText" class="error-textarea" readonly></textarea>
      </div>
      <div class="modal-foot">
        <button id="copyErrorBtn" type="button" class="action">Скопировать</button>
        <button id="okErrorBtn" type="button" class="action primary">Понятно</button>
      </div>
    </div>
  </div>

    </main>
  </div>


  <script src="/static/theme.js"></script>
  <script src="/static/sidebar.js"></script>
  <script src="/static/app_shell.js?v=20260821b"></script>
  <script src="/static/list.js?v=20260731a"></script>
</body>
</html>
