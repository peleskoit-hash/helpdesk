<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ES DESK - Список заявок</title>
  <link rel="icon" type="image/svg+xml" sizes="any" href="/static/chert.svg?v=20261028-favicon-v1" />
  <link rel="stylesheet" href="/static/styles.css?v=20261105-table-header-overflow-v1" />
</head>
<body data-sidebar-ready="0">
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-brand">ES DESK</div>
      <h2 class="sidebar-title">Заявки</h2>
      <div class="tab-list">
        <a class="tab-btn admin-only hidden" href="/tickets?tab=unassigned" data-tab="unassigned"><span class="tab-btn-label">Нераспределённые</span><span class="tab-btn-count" data-tab-count="unassigned">0</span></a>
        <a class="tab-btn active" href="/tickets?tab=active" data-tab="active"><span class="tab-btn-label">Активные</span><span class="tab-btn-count" data-tab-count="active">0</span></a>
        <a class="tab-btn" href="/tickets?tab=frozen" data-tab="frozen"><span class="tab-btn-label">Замороженные</span><span class="tab-btn-count" data-tab-count="frozen">0</span></a>
        <a class="tab-btn" href="/tickets?tab=closed" data-tab="closed"><span class="tab-btn-label">Закрытые</span><span class="tab-btn-count" data-tab-count="closed">0</span></a>
        <a class="tab-btn admin-only hidden" href="/tickets?tab=special" data-tab="special"><span class="tab-btn-label">Особые</span><span class="tab-btn-count" data-tab-count="special">0</span></a>
      </div>
      <div id="adminAgentFilter" class="admin-agent-filter admin-only hidden">
        <label class="status-panel-title admin-agent-header">
          <input id="adminAgentToggleAll" type="checkbox" />
          <span>Все заявки</span>
        </label>
        <div id="adminAgentList" class="admin-agent-list"></div>
      </div>
      <a class="settings-link admin-only hidden" href="/settings">
        <span>Настройки</span>
        <img src="/static/settings-gear.svg" alt="" />
      </a>
      <a class="settings-link admin-only hidden" href="/management">
        <span>Управление</span>
      </a>
      <div class="sidebar-admin-separator admin-only hidden"></div>
      <a class="settings-link admin-only hidden" href="/statuses">
        <span>Статусы</span>
      </a>
      <a class="settings-link admin-only hidden" href="/management/tasks">
        <span>Задачи и Регулярки</span>
      </a>
      <div class="sidebar-bottom">
        <div class="status-panel hidden">
          <div class="status-panel-title">Статус</div>
          <button class="agent-status-btn status-online" data-availability-status="online">В сети</button>
          <button class="agent-status-btn status-on-ticket" data-availability-status="on_ticket">На заявке</button>
          <button class="agent-status-btn status-waiting" data-availability-status="waiting">В ожидании</button>
          <button class="agent-status-btn status-lunch" data-availability-status="lunch">Обед</button>
          <button class="agent-status-btn status-offline" data-availability-status="offline">Не в сети</button>
        </div>
        <div class="sidebar-user-actions">
          <div class="agent-avatar" title="Текущий пользователь">A</div>
          <form action="/logout" method="post" data-sidebar-logout-form hidden></form>
        </div>
      </div>
    </aside>

    <main id="appContent" class="main" data-shell-page="tickets-list">
      <div class="toolbar">
        <label id="roleControl" class="hidden">Роль
          <select id="roleSelect">
            <option value="agent" selected>Сотрудник</option>
            <option value="admin">Администратор</option>
            <option value="trainee">Стажёр</option>
            <option value="chiki_piki">Чики-пики</option>
          </select>
        </label>

        <label id="agentSelectWrap" class="hidden">Пользователь
          <select id="agentSelect"></select>
        </label>

        <div class="search-input-wrap">
          <input id="searchInput" placeholder="Поиск по теме/клиенту/сообщениям" />
          <button id="searchClearBtn" class="search-clear-btn hidden" type="button" aria-label="Очистить поиск">&times;</button>
        </div>
        <select id="bulkAssignBtn" class="action bulk-assign-btn admin-only hidden" aria-label="Назначить ответственного (0)" disabled>
          <option value="__placeholder__" disabled selected>Назначить ответственного (0)</option>
        </select>
        <button id="bulkFreezeBtn" class="action bulk-freeze-btn admin-only hidden" type="button" disabled>Заморозить</button>
        <button id="bulkUnfreezeBtn" class="action bulk-freeze-btn admin-only hidden" type="button" disabled>Разморозить</button>
        <div id="bulkAdminActions" class="bulk-admin-actions admin-only hidden">
          <label><input id="bulkSkipClientNotification" type="checkbox" autocomplete="off" />Без ответа клиенту</label>
          <button id="bulkCloseBtn" class="action" type="button" disabled>Завершить</button>
          <button id="bulkDeleteBtn" class="action danger" type="button" disabled>Удалить</button>
        </div>
        <div class="display-settings">
          <label class="color-toggle" id="colorToggleLabel">
            <input id="colorEnabledInput" class="desk-toggle" type="checkbox" role="switch" aria-describedby="colorLegend" />
            <span id="colorToggleText" tabindex="0" aria-describedby="colorLegend">Цветные плашки</span>
            <span id="colorLegend" class="color-legend" role="tooltip" aria-hidden="true" popover="manual">
              <span class="color-legend-swatch color-legend-task">Задача</span>
              <span class="color-legend-swatch color-legend-request">Заявка</span>
              <span class="color-legend-swatch color-legend-group-task">Увольнение</span>
              <span class="color-legend-swatch color-legend-internal-task">Внутренняя</span>
              <span class="color-legend-swatch color-legend-frozen">Замороженная</span>
              <span class="color-legend-swatch color-legend-closed">Закрытая</span>
            </span>
          </label>
          <button id="themeToggleBtn" class="action theme-toggle" type="button" aria-label="Оформление">Оформление</button>
        </div>
      </div>

      <div id="taskPanel" class="task-panel hidden">
        <div id="taskPanelSlots" class="task-panel-slots"></div>
        <button id="taskPanelMoreBtn" class="task-panel-more hidden" type="button" aria-label="Ещё заявки">…</button>
        <div id="taskPanelDropdown" class="task-panel-dropdown hidden"></div>
      </div>

      <section class="content" style="grid-template-columns: 1fr;">
        <div class="panel table-wrap">
          <div class="table-scroll">
            <table id="ticketsTable">
              <thead>
                <tr id="ticketsHeaderRow"></tr>
              </thead>
              <tbody id="ticketsTableBody"></tbody>
            </table>
            <div id="emptyText" class="status" style="padding:12px;">Список пуст</div>
          </div>
          <label id="columnAutoWidthControl" class="column-auto-width-control hidden">
            <input id="columnAutoWidthInput" type="checkbox" />
            <span>Режим автоматического растягивания столбцов</span>
          </label>
          <div class="table-pagination-footer">
            <div class="table-pagination-total">Всего: <span id="ticketCount">0</span></div>
            <div class="table-pagination-nav">
              <button id="prevPageBtn" class="action table-page-btn" type="button" aria-label="Предыдущая страница">&lt;</button>
              <div id="paginationPages" class="table-pagination-pages"></div>
              <button id="nextPageBtn" class="action table-page-btn" type="button" aria-label="Следующая страница">&gt;</button>
            </div>
          </div>
        </div>
      </section>
  <div id="bulkActionModal" class="modal hidden">
    <div class="modal-dialog assign-dialog">
      <div class="modal-head">
        <div id="bulkActionModalTitle" style="font-weight:700;">Подтверждение</div>
        <button id="closeBulkActionModalBtn" type="button" class="action">Закрыть</button>
      </div>
      <div id="bulkActionModalText" class="modal-body"></div>
      <div class="modal-foot">
        <button id="cancelBulkActionBtn" type="button" class="action">Отмена</button>
        <button id="confirmBulkActionBtn" type="button" class="action primary">Подтвердить</button>
      </div>
    </div>
  </div>

  <div id="columnsModal" class="modal hidden">
    <div class="modal-dialog columns-dialog">
      <div class="modal-head">
        <div class="columns-modal-title" style="font-weight:700;">Настройка списка заявок</div>
      </div>
      <div class="modal-body columns-modal-body">
        <button id="editColumnsWidthBtn" class="action" type="button">Редактирование столбцов</button>
        <label class="columns-add-label">Добавить колонку
          <select id="columnAddSelect"></select>
        </label>
        <div id="columnsDraftList" class="columns-draft-list"></div>
      </div>
      <div class="modal-foot columns-modal-foot">
        <label class="columns-task-panel-toggle">
          <input id="taskPanelEnabledInput" type="checkbox" class="desk-toggle" />
          <span>Панель задач</span>
        </label>
        <button id="closeColumnsModalBtn" type="button" class="action" aria-label="Закрыть">Закрыть</button>
        <button id="saveColumnsBtn" type="button" class="action primary">Сохранить</button>
      </div>
    </div>
    <div id="resizeColumnsActions" class="resize-columns-actions hidden">
      <button id="saveResizeColumnsBtn" type="button" class="action primary">Сохранить</button>
      <button id="cancelResizeColumnsBtn" type="button" class="action">Отмена</button>
    </div>
  </div>

  <div id="errorModal" class="modal hidden">
    <div class="modal-dialog error-dialog">
      <div class="modal-head">
        <div style="font-weight:700;">Ошибка</div>
        <button id="closeErrorModalBtn" type="button" class="action">Закрыть</button>
      </div>
      <div class="modal-body">
        <textarea id="errorText" class="error-textarea" readonly></textarea>
      </div>
      <div class="modal-foot">
        <button id="copyErrorBtn" type="button" class="action">Скопировать</button>
        <button id="okErrorBtn" type="button" class="action primary">Понятно</button>
      </div>
    </div>
  </div>

    </main>
  </div>


  <script src="/static/theme.js?v=20261029-contour-delete-only-v1"></script>
  <script src="/static/sidebar.js?v=20261027-themed-dialogs-v1"></script>
  <script src="/static/error_dialog.js?v=20261011a"></script>
  <script src="/static/app_shell.js?v=20261105-column-auto-width-v8"></script>
  <script src="/static/ticket_column_auto_width.js?v=20261105-column-auto-width-v6"></script>
  <script src="/static/desk_dialogs.js?v=20261027-dialog-prompts-v4"></script>
  <script src="/static/list.js?v=20261105-column-auto-width-v7"></script>
</body>
</html>
