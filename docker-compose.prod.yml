services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - esdesk_prod_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
    restart: unless-stopped
    env_file:
      - ${ESDESK_ENV_FILE:-.env.prod}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BITRIX_PASSWORD_ENCRYPTION_KEY: ${BITRIX_PASSWORD_ENCRYPTION_KEY:?BITRIX_PASSWORD_ENCRYPTION_KEY must be set and non-empty}
      APP_TIMEZONE: ${APP_TIMEZONE}
      ATTACHMENT_STORAGE_DIR: ${ATTACHMENT_STORAGE_DIR}
      BUTTON_CONFIG_DIR: /button-config
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - "./TG buttons:/button-config:ro"
      - ./storage:/app/storage
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  esdesk_prod_pg_data:
