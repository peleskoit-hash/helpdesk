services:
  db:
    image: postgres:16
    container_name: helpdesk_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
    container_name: helpdesk_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://helpdesk:helpdesk@db:5432/helpdesk
      APP_TIMEZONE: Europe/Moscow
      BUTTON_CONFIG_DIR: /button-config
      ATTACHMENT_STORAGE_DIR: /app/storage/attachments
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api:/app
      - "./TG buttons:/button-config:ro"
      - ./storage:/app/storage
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app --reload-exclude /app/storage/attachments
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
    name: 2026-04-23-https-helpdeskeddy-ru_pg_data
    external: true
